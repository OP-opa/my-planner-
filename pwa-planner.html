<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="My Planner" />
  <meta name="theme-color" content="#11111b" />
  <title>My Planner & Notes</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #11111b; font-family: -apple-system, 'Inter', system-ui, sans-serif; color: #e2e8f0; overscroll-behavior: none; }
    input, textarea, select, button { font-family: inherit; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #1e1e2e; } ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const PRIORITIES = ["Low", "Medium", "High"];
const PCOL = { Low: "#6ee7b7", Medium: "#fcd34d", High: "#f87171" };
const DEFAULT_TAGS = ["work", "personal", "ideas", "urgent"];
const uid = () => Math.random().toString(36).slice(2, 10);

// ── Storage helpers (localStorage for standalone PWA) ─────────
const store = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// ── Task Row ──────────────────────────────────────────────────
function TaskRow({ task, onToggle, onDelete }) {
  return (
    <div style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 0", borderBottom:"1px solid #2a2a3a" }}>
      <input type="checkbox" checked={task.done} onChange={() => onToggle(task.id)}
        style={{ accentColor:"#818cf8", width:18, height:18, cursor:"pointer", flexShrink:0 }} />
      <span style={{ flex:1, fontSize:15, color:task.done?"#555":"#e2e8f0", textDecoration:task.done?"line-through":"none" }}>
        {task.text}
      </span>
      <span style={{ fontSize:11, padding:"2px 8px", borderRadius:99, background:PCOL[task.priority]+"33", color:PCOL[task.priority], flexShrink:0 }}>
        {task.priority}
      </span>
      <button onClick={() => onDelete(task.id)}
        style={{ background:"none", border:"none", color:"#555", cursor:"pointer", fontSize:20, lineHeight:1, padding:"0 4px" }}>×</button>
    </div>
  );
}

// ── Add Task ──────────────────────────────────────────────────
function AddTask({ onAdd }) {
  const [text, setText] = useState("");
  const [pri, setPri] = useState("Medium");
  const submit = () => { if (!text.trim()) return; onAdd({ id:uid(), text:text.trim(), priority:pri, done:false }); setText(""); };
  return (
    <div style={{ display:"flex", gap:6, marginTop:10 }}>
      <input value={text} onChange={e => setText(e.target.value)} onKeyDown={e => e.key==="Enter" && submit()}
        placeholder="Add task…"
        style={{ flex:1, background:"#1e1e2e", border:"1px solid #333", borderRadius:8, padding:"8px 12px", color:"#e2e8f0", fontSize:14 }} />
      <select value={pri} onChange={e => setPri(e.target.value)}
        style={{ background:"#1e1e2e", border:"1px solid #333", borderRadius:8, padding:"8px", color:"#e2e8f0", fontSize:13 }}>
        {PRIORITIES.map(p => <option key={p}>{p}</option>)}
      </select>
      <button onClick={submit}
        style={{ background:"#6366f1", border:"none", borderRadius:8, padding:"8px 16px", color:"#fff", cursor:"pointer", fontWeight:700, fontSize:18 }}>+</button>
    </div>
  );
}

// ── Note Card ─────────────────────────────────────────────────
function NoteCard({ note, onEdit, onDelete }) {
  useEffect(() => {
    if (!note.reminder) return;
    const ms = new Date(note.reminder) - Date.now();
    if (ms <= 0) return;
    const t = setTimeout(() => alert("⏰ Reminder: " + note.title), ms);
    return () => clearTimeout(t);
  }, [note.reminder, note.title]);

  return (
    <div style={{ background:"#1e1e2e", border:"1px solid #2a2a3a", borderRadius:14, padding:"14px 16px", marginBottom:12 }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
        <div style={{ flex:1 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:6 }}>
            <span style={{ fontWeight:700, color:"#e2e8f0", fontSize:16 }}>{note.title}</span>
            <span style={{ fontSize:11, padding:"2px 8px", borderRadius:99, background:PCOL[note.priority]+"33", color:PCOL[note.priority] }}>{note.priority}</span>
          </div>
          {note.body ? <p style={{ color:"#94a3b8", fontSize:14, lineHeight:1.6, marginBottom:8 }}>{note.body}</p> : null}
          <div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>
            {note.tags.map(t => <span key={t} style={{ fontSize:12, padding:"2px 9px", borderRadius:99, background:"#312e81", color:"#a5b4fc" }}>#{t}</span>)}
            {note.reminder && <span style={{ fontSize:12, padding:"2px 9px", borderRadius:99, background:"#1e3a5f", color:"#7dd3fc" }}>
              ⏰ {new Date(note.reminder).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}
            </span>}
          </div>
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
          <button onClick={() => onEdit(note)} style={{ background:"#2a2a3a", border:"none", borderRadius:7, padding:"6px 12px", color:"#94a3b8", cursor:"pointer", fontSize:13 }}>Edit</button>
          <button onClick={() => onDelete(note.id)} style={{ background:"#2a2a3a", border:"none", borderRadius:7, padding:"6px 12px", color:"#f87171", cursor:"pointer", fontSize:13 }}>Del</button>
        </div>
      </div>
    </div>
  );
}

// ── Note Modal ────────────────────────────────────────────────
function NoteModal({ note, onSave, onClose, allTags }) {
  const [title, setTitle] = useState(note?.title || "");
  const [body, setBody] = useState(note?.body || "");
  const [priority, setPri] = useState(note?.priority || "Medium");
  const [tags, setTags] = useState(note?.tags || []);
  const [tagInput, setTagInput] = useState("");
  const [reminder, setReminder] = useState(note?.reminder || "");

  const toggleTag = t => setTags(p => p.includes(t) ? p.filter(x => x!==t) : [...p,t]);
  const addTag = () => { const t=tagInput.trim().toLowerCase(); if(t&&!tags.includes(t)) setTags(p=>[...p,t]); setTagInput(""); };
  const save = () => { if(!title.trim()) return; onSave({ id:note?note.id:uid(), title:title.trim(), body, priority, tags, reminder }); };

  const inp = { background:"#1e1e2e", border:"1px solid #333", borderRadius:8, padding:"10px 12px", color:"#e2e8f0", fontSize:15, width:"100%" };
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:200, padding:16 }}>
      <div style={{ background:"#181825", border:"1px solid #2a2a3a", borderRadius:18, padding:24, width:"100%", maxWidth:500, display:"flex", flexDirection:"column", gap:14, maxHeight:"90vh", overflowY:"auto" }}>
        <h3 style={{ color:"#e2e8f0", fontSize:18 }}>{note ? "Edit Note" : "New Note"}</h3>
        <input style={inp} placeholder="Title" value={title} onChange={e=>setTitle(e.target.value)} />
        <textarea style={{...inp, minHeight:80, resize:"vertical"}} placeholder="Body…" value={body} onChange={e=>setBody(e.target.value)} />
        <div>
          <div style={{ color:"#94a3b8", fontSize:12, fontWeight:600, textTransform:"uppercase", letterSpacing:1, marginBottom:8 }}>Priority</div>
          <div style={{ display:"flex", gap:8 }}>
            {PRIORITIES.map(p => <button key={p} onClick={()=>setPri(p)}
              style={{ flex:1, border:"none", borderRadius:99, padding:"6px 0", cursor:"pointer", fontSize:13, fontWeight:600,
                background:priority===p?PCOL[p]+"44":"#2a2a3a", color:priority===p?PCOL[p]:"#94a3b8" }}>{p}</button>)}
          </div>
        </div>
        <div>
          <div style={{ color:"#94a3b8", fontSize:12, fontWeight:600, textTransform:"uppercase", letterSpacing:1, marginBottom:8 }}>Tags</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:8 }}>
            {allTags.map(t => <button key={t} onClick={()=>toggleTag(t)}
              style={{ border:"none", borderRadius:99, padding:"4px 12px", cursor:"pointer", fontSize:13,
                background:tags.includes(t)?"#312e81":"#2a2a3a", color:tags.includes(t)?"#a5b4fc":"#94a3b8" }}>#{t}</button>)}
          </div>
          <div style={{ display:"flex", gap:6 }}>
            <input style={{...inp, width:"auto", flex:1}} placeholder="Custom tag…" value={tagInput}
              onChange={e=>setTagInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTag()} />
            <button onClick={addTag} style={{ background:"#312e81", border:"none", borderRadius:8, padding:"10px 14px", color:"#a5b4fc", cursor:"pointer", fontWeight:600 }}>Add</button>
          </div>
        </div>
        <div>
          <div style={{ color:"#94a3b8", fontSize:12, fontWeight:600, textTransform:"uppercase", letterSpacing:1, marginBottom:8 }}>Reminder</div>
          <input type="datetime-local" style={inp} value={reminder} onChange={e=>setReminder(e.target.value)} />
        </div>
        <div style={{ display:"flex", gap:8, justifyContent:"flex-end", marginTop:4 }}>
          <button onClick={onClose} style={{ background:"#2a2a3a", border:"none", borderRadius:8, padding:"10px 20px", color:"#94a3b8", cursor:"pointer", fontSize:15 }}>Cancel</button>
          <button onClick={save} style={{ background:"#6366f1", border:"none", borderRadius:8, padding:"10px 22px", color:"#fff", fontWeight:700, cursor:"pointer", fontSize:15 }}>Save</button>
        </div>
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("planner");
  const [todayTasks, setTT] = useState(() => store.get("tt") || []);
  const [tomorrowTasks, setTM] = useState(() => store.get("tm") || []);
  const [todayGoal, setTG] = useState(() => store.get("tg") || "");
  const [tomorrowGoal, setMG] = useState(() => store.get("mg") || "");
  const [notes, setNotes] = useState(() => store.get("notes") || []);
  const [filterTag, setFilter] = useState("all");
  const [showModal, setShowModal] = useState(false);
  const [editNote, setEditNote] = useState(null);
  const [now, setNow] = useState(new Date());

  useEffect(() => { const t = setInterval(()=>setNow(new Date()), 60000); return ()=>clearInterval(t); }, []);
  useEffect(() => { store.set("tt", todayTasks); }, [todayTasks]);
  useEffect(() => { store.set("tm", tomorrowTasks); }, [tomorrowTasks]);
  useEffect(() => { store.set("tg", todayGoal); }, [todayGoal]);
  useEffect(() => { store.set("mg", tomorrowGoal); }, [tomorrowGoal]);
  useEffect(() => { store.set("notes", notes); }, [notes]);

  const addTask = (setter) => task => setter(p => [...p, task]);
  const toggleTask = (setter) => id => setter(p => p.map(t => t.id===id ? {...t, done:!t.done} : t));
  const delTask = (setter) => id => setter(p => p.filter(t => t.id!==id));

  const saveNote = note => {
    setNotes(p => editNote ? p.map(x => x.id===note.id ? note : x) : [note, ...p]);
    setShowModal(false); setEditNote(null);
  };

  const allTags = [...new Set([...DEFAULT_TAGS, ...notes.flatMap(n => n.tags)])];
  const filtered = filterTag==="all" ? notes : notes.filter(n => n.tags.includes(filterTag));
  const done = todayTasks.filter(t=>t.done).length;

  const goalBox = { width:"100%", background:"#1e1e2e", border:"1px solid #333", borderRadius:8, padding:"10px 12px", color:"#e2e8f0", fontSize:15, resize:"vertical", minHeight:64 };
  const sec = { background:"#181825", border:"1px solid #2a2a3a", borderRadius:16, padding:20, marginBottom:18 };
  const lbl = { color:"#64748b", fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:1.2, marginBottom:8, display:"block" };

  return (
    <div style={{ minHeight:"100vh", background:"#11111b", paddingBottom:40 }}>
      {/* Header */}
      <div style={{ background:"#181825", borderBottom:"1px solid #2a2a3a", padding:"env(safe-area-inset-top, 16px) 20px 14px", position:"sticky", top:0, zIndex:50 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10 }}>
          <div>
            <div style={{ fontWeight:700, fontSize:19, color:"#e2e8f0" }}>My Planner & Notes</div>
            <div style={{ color:"#475569", fontSize:13 }}>
              {now.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})} · {now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}
            </div>
          </div>
          <div style={{ display:"flex", gap:6 }}>
            {["planner","notes"].map(t => (
              <button key={t} onClick={()=>setTab(t)}
                style={{ border:"none", borderRadius:10, padding:"8px 18px", cursor:"pointer", fontWeight:600, fontSize:14,
                  background:tab===t?"#6366f1":"#2a2a3a", color:tab===t?"#fff":"#94a3b8" }}>
                {t==="planner" ? "📅 Planner" : "📝 Notes"}
              </button>
            ))}
          </div>
        </div>
      </div>

      <div style={{ maxWidth:700, margin:"0 auto", padding:"20px 16px" }}>
        {tab==="planner" && (<>
          {/* Today */}
          <div style={sec}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
              <span style={{ fontWeight:700, fontSize:17, color:"#a5b4fc" }}>☀️ Today</span>
              {todayTasks.length>0 && <span style={{ fontSize:13, color:"#64748b" }}>{done}/{todayTasks.length} done</span>}
            </div>
            <label style={lbl}>Today's Goal</label>
            <textarea style={goalBox} placeholder="What do you want to achieve today?" value={todayGoal} onChange={e=>setTG(e.target.value)} />
            <div style={{ marginTop:16 }}>
              <label style={lbl}>Tasks</label>
              {todayTasks.length===0 && <div style={{ color:"#444", fontSize:14, padding:"6px 0" }}>No tasks yet.</div>}
              {todayTasks.map(t => <TaskRow key={t.id} task={t} onToggle={toggleTask(setTT)} onDelete={delTask(setTT)} />)}
              <AddTask onAdd={addTask(setTT)} />
            </div>
          </div>

          {/* Tomorrow */}
          <div style={sec}>
            <div style={{ fontWeight:700, fontSize:17, color:"#6ee7b7", marginBottom:14 }}>🌙 Tomorrow</div>
            <label style={lbl}>Tomorrow's Goal</label>
            <textarea style={goalBox} placeholder="What do you want to tackle tomorrow?" value={tomorrowGoal} onChange={e=>setMG(e.target.value)} />
            <div style={{ marginTop:16 }}>
              <label style={lbl}>Tasks</label>
              {tomorrowTasks.length===0 && <div style={{ color:"#444", fontSize:14, padding:"6px 0" }}>No tasks planned yet.</div>}
              {tomorrowTasks.map(t => <TaskRow key={t.id} task={t} onToggle={toggleTask(setTM)} onDelete={delTask(setTM)} />)}
              <AddTask onAdd={addTask(setTM)} />
            </div>
          </div>
        </>)}

        {tab==="notes" && (<>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:10 }}>
            <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
              <button onClick={()=>setFilter("all")}
                style={{ border:"none", borderRadius:99, padding:"5px 14px", cursor:"pointer", fontSize:13,
                  background:filterTag==="all"?"#6366f1":"#2a2a3a", color:filterTag==="all"?"#fff":"#94a3b8" }}>All</button>
              {allTags.map(t => <button key={t} onClick={()=>setFilter(t)}
                style={{ border:"none", borderRadius:99, padding:"5px 14px", cursor:"pointer", fontSize:13,
                  background:filterTag===t?"#312e81":"#2a2a3a", color:filterTag===t?"#a5b4fc":"#94a3b8" }}>#{t}</button>)}
            </div>
            <button onClick={()=>{setEditNote(null);setShowModal(true);}}
              style={{ background:"#6366f1", border:"none", borderRadius:10, padding:"9px 20px", color:"#fff", fontWeight:700, cursor:"pointer", fontSize:15 }}>+ New Note</button>
          </div>
          {filtered.length===0 && <div style={{ textAlign:"center", color:"#444", padding:"50px 0", fontSize:16 }}>No notes yet — create one!</div>}
          {filtered.map(n => <NoteCard key={n.id} note={n} onEdit={n=>{setEditNote(n);setShowModal(true);}} onDelete={id=>setNotes(p=>p.filter(x=>x.id!==id))} />)}
        </>)}
      </div>

      {showModal && <NoteModal note={editNote} allTags={allTags} onSave={saveNote} onClose={()=>{setShowModal(false);setEditNote(null);}} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
